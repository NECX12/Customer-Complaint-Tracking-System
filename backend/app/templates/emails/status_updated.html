<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background: #ea580c; color: white; padding: 20px; text-align: center; border-radius: 8px 8px 0 0; }
        .content { background: #f9fafb; padding: 20px; border: 1px solid #e5e7eb; }
        .footer { text-align: center; padding: 15px; color: #6b7280; font-size: 12px; }
        .badge { display: inline-block; padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .old { background: #fee2e2; color: #dc2626; text-decoration: line-through; }
        .new { background: #dbeafe; color: #1a56db; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Complaint Status Update</h1>
        </div>
        <div class="content">
            <p>There has been an update to your complaint.</p>
            <p><strong>Title:</strong> {{ title }}</p>
            <p><strong>Complaint ID:</strong> {{ complaint_id }}</p>
            <p>
                <strong>Status:</strong>
                <span class="badge old">{{ old_status }}</span>
                →
                <span class="badge new">{{ new_status }}</span>
            </p>
            <p>Log in to view the full details and timeline of your complaint.</p>
        </div>
        <div class="footer">
            <p>Mikano Customer Complaint Tracking System</p>
        </div>
    </div>
</body>
</html>
